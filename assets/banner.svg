<svg viewBox="0 0 1280 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#12141c"/>
      <stop offset="1" stop-color="#1a1d2b"/>
    </linearGradient>
    <linearGradient id="lineGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5865F2" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#5865F2" stop-opacity="1"/>
      <stop offset="1" stop-color="#8b93f8" stop-opacity="1"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#5865F2" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#5865F2" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.4" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#dots)"/>
  <rect width="1280" height="320" fill="url(#glow)"/>

  <!-- Candlesticks: a gentle uptrend, muted red/green with one blurple accent candle -->
  <g stroke-linecap="round">
    <!-- x, wick-top, wick-bottom, body-top, body-bottom, color -->
    <line x1="90"  y1="150" x2="90"  y2="210" stroke="#e0546b" stroke-width="2"/>
    <rect x="80" y="165" width="20" height="30" fill="#e0546b" fill-opacity="0.85" rx="2"/>

    <line x1="150" y1="140" x2="150" y2="205" stroke="#e0546b" stroke-width="2"/>
    <rect x="140" y="150" width="20" height="35" fill="#e0546b" fill-opacity="0.85" rx="2"/>

    <line x1="210" y1="120" x2="210" y2="190" stroke="#4fbf8b" stroke-width="2"/>
    <rect x="200" y="150" width="20" height="30" fill="#4fbf8b" fill-opacity="0.85" rx="2"/>

    <line x1="270" y1="95"  x2="270" y2="165" stroke="#4fbf8b" stroke-width="2"/>
    <rect x="260" y="105" width="20" height="40" fill="#4fbf8b" fill-opacity="0.85" rx="2"/>

    <line x1="330" y1="80"  x2="330" y2="150" stroke="#e0546b" stroke-width="2"/>
    <rect x="320" y="95"  width="20" height="28" fill="#e0546b" fill-opacity="0.85" rx="2"/>

    <line x1="390" y1="55"  x2="390" y2="125" stroke="#5865F2" stroke-width="2.5"/>
    <rect x="378" y="65"  width="24" height="38" fill="#5865F2" rx="3"/>
  </g>

  <!-- Trend line riding over the candles -->
  <path d="M 70 205 L 150 185 L 210 165 L 270 130 L 330 115 L 390 85 L 460 70"
        fill="none" stroke="url(#lineGlow)" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="460" cy="70" r="6" fill="#8b93f8"/>
  <circle cx="460" cy="70" r="11" fill="#8b93f8" fill-opacity="0.25"/>

  <!-- Wordmark -->
  <text x="90" y="255" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="54"
        font-weight="700" fill="#f5f6fb" letter-spacing="0.5">Market Bot</text>
  <text x="94" y="288" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19"
        font-weight="400" fill="#9298b8">Daily market &amp; AI digest, posted straight to Discord</text>

  <!-- Small chip, right side -->
  <g transform="translate(930, 40)">
    <rect width="220" height="44" rx="22" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <circle cx="26" cy="22" r="6" fill="#4fbf8b"/>
    <text x="42" y="28" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15"
          fill="#c7cae6">Python · no API keys</text>
  </g>
</svg>
